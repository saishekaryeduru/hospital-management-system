# Full-stack local run: PostgreSQL, the Spring Boot API, and the React
# frontend served by nginx (which proxies /api to the backend, so the
# browser only ever talks to one origin).
#
# Usage:
#   cp .env.example .env   # then set a real JWT_SECRET
#   docker compose up --build
# Frontend: http://localhost:5174   API: http://localhost:8081

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "5432"

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/hospital
      DB_USERNAME: hospital
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hospital}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32-chars-minimum}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  db-data:
